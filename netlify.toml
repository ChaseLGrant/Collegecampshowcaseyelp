# Netlify build settings for Camp Check (thecampcheck.com). Next.js runs on Netlify's
# OpenNext adapter (@netlify/plugin-nextjs), detected automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Declared explicitly: sites created through the API don't get the Next.js runtime auto-installed.
[[plugins]]
  package = "@netlify/plugin-nextjs"
